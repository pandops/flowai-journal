name: Qualify journal

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected journal ref
        type: string
        required: true
      task_manager_sha:
        description: Full commit SHA of task-manager
        type: string
        required: true
      executor_docker_openhands_sha:
        description: Full commit SHA of Docker OpenHands
        type: string
        required: true
      executor_registry_sha:
        description: Full commit SHA of executor-registry
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      EXECUTOR_DOCKER_OPENHANDS_SHA: ${{ inputs.executor_docker_openhands_sha }}
      EXECUTOR_REGISTRY_SHA: ${{ inputs.executor_registry_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA TASK_MANAGER_SHA EXECUTOR_DOCKER_OPENHANDS_SHA EXECUTOR_REGISTRY_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage declarations and pinned publisher schemas
        shell: bash
        run: |
          source_sha="${EXPECTED_SOURCE_SHA,,}"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          umask 077
          contracts="$(mktemp -d "$RUNNER_TEMP/journal-contracts.XXXXXXXX")"
          mkdir -p "$contracts/qa-e2e/scripts"
          git show "$source_sha:qualification/journal-declarations.json" > "$contracts/qa-e2e/scripts/shared-test-inputs.json"

          fetch_schema() {
            local repo="$1" sha="$2" root="$3" file="$4" checksum="$5" status
            local url="https://raw.githubusercontent.com/pandops/$repo/${sha,,}/schemas/$file"
            local output="$root/schemas/$file"
            mkdir -p "$contracts/$root/schemas"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$output" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            printf '%s  %s\n' "$checksum" "$contracts/$output" | sha256sum --check --status
            jq -e 'type == "object"' "$contracts/$output" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$output")
          }

          fetch_schema flowai-task-manager "$TASK_MANAGER_SHA" svc/task-manager event.queued.schema.json 6ca86aa1f2d7a1bc249c2d64becbc4f9dfc8fc98ef62d2166a269821b22ed6bf
          fetch_schema flowai-task-manager "$TASK_MANAGER_SHA" svc/task-manager defs.schema.json 5bb6eea9a1419dd7019c4a1998a83e57e71c277c3ecedd2f13f67c6a1023adc6
          fetch_schema flowai-executor-registry "$EXECUTOR_REGISTRY_SHA" svc/executor-registry event.executor_status.schema.json 6dc9117ea7a8a175608d87f0fd469f49b56d3c3b0dc7b966c5417aa4aacfc72e
          fetch_schema flowai-executor-docker-openhands "$EXECUTOR_DOCKER_OPENHANDS_SHA" executor/docker_openhands executor-event.schema.json 6928d3e310459c155814216b7206e4da888be58982f96bf51dbef3188821849e
          printf 'FLOWAI_CONTRACT_FIXTURE_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: PostgreSQL integration tests
        id: integration_tests
        shell: bash
        run: |
          postgres='docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c'
          docker pull --platform linux/amd64 "$postgres"
          # The existing test fixture resolves this alias in the runner's Docker store.
          docker tag "$postgres" docker.io/library/postgres:16
          go test -mod=readonly -count=1 -coverpkg=./... -tags=integration -v ./...

      - name: Build local Linux image
        id: image_build
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/journal.iid" .
          cat "$RUNNER_TEMP/journal.iid"

      - name: Verify and package the qualified OCI image
        shell: bash
        env:
          QUALIFICATION_INPUTS: ${{ toJSON(inputs) }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          INTEGRATION_TESTS: ${{ steps.integration_tests.outcome }}
          IMAGE_BUILD: ${{ steps.image_build.outcome }}
        run: |
          set -euo pipefail
          [[ "$UNIT_TESTS" == success ]]
          [[ "$INTEGRATION_TESTS" == success ]]
          [[ "$IMAGE_BUILD" == success ]]
          [[ "$(skopeo --version)" == "skopeo version 1.13.3" ]]
          [[ "$(jq --version)" == "jq-1.7" ]]
          jq -e --arg source "$GITHUB_SHA" '(.expected_source_sha | ascii_downcase) == $source and all(.[]; test("^[a-fA-F0-9]{40}$"))' <<<"$QUALIFICATION_INPUTS" >/dev/null
          image_id="$(cat "$RUNNER_TEMP/journal.iid")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect --format '{{ .Id }}' "$image_id")" == "$image_id" ]]
          layout="$RUNNER_TEMP/qualified-oci-layout"
          skopeo copy --format oci "docker-daemon:$image_id" "oci:$layout:qualified"
          manifest="$(jq -er '
            select(.schemaVersion == 2 and (.manifests | length) == 1)
            | .manifests[0]
            | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
            | .digest | select(test("^sha256:[a-f0-9]{64}$"))
          ' "$layout/index.json")"
          cd "$layout"
          manifest_path="blobs/sha256/${manifest#sha256:}"
          printf '%s  %s\n' "${manifest#sha256:}" "$manifest_path" | sha256sum --check
          config="$(jq -er '.config.digest | select(test("^sha256:[a-f0-9]{64}$"))' "$manifest_path")"
          skopeo inspect --config "docker-daemon:$image_id" | jq -cS . > "$RUNNER_TEMP/source-oci-config.json"
          jq -cS . "blobs/sha256/${config#sha256:}" | cmp "$RUNNER_TEMP/source-oci-config.json" -
          jq -er '
            [.config, .layers[]][].digest
            | if test("^sha256:[a-f0-9]{64}$") then sub("^sha256:"; "") else error("invalid OCI digest") end
            | "\(.)  blobs/sha256/\(.)"
          ' "$manifest_path" | sha256sum --check
          jq -e '.os == "linux" and .architecture == "amd64"' "blobs/sha256/${config#sha256:}" >/dev/null

          # Verify that conversion retained Docker's ordered, uncompressed layer identities.
          layers="$(docker image inspect --format '{{json .RootFS.Layers}}' "$image_id")"
          jq -e --argjson layers "$layers" '
            .rootfs.type == "layers" and .rootfs.diff_ids == $layers and (.rootfs.diff_ids | length) > 0
          ' "blobs/sha256/${config#sha256:}" >/dev/null

          artifact="$RUNNER_TEMP/qualified-oci"
          mkdir "$artifact"
          tar -cf "$artifact/image.oci.tar" oci-layout index.json blobs
          cd "$artifact"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" \
            --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg imageId "$image_id" --arg manifest "$manifest" --arg config "$config" \
            --arg job "$GITHUB_JOB" --argjson inputs "$QUALIFICATION_INPUTS" \
            --arg unit_tests "$UNIT_TESTS" --arg integration_tests "$INTEGRATION_TESTS" --arg image_build "$IMAGE_BUILD" \
            '{job:$job,inputs:$inputs,steps:{unit_tests:$unit_tests,integration_tests:$integration_tests,image_build:$image_build},repository:$repository,ref:$ref,source:$source,run:$run,attempt:$attempt,imageId:$imageId,manifest:$manifest,config:$config}' > receipt.json
          sha256sum image.oci.tar receipt.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload qualified OCI archive
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-oci/image.oci.tar
            ${{ runner.temp }}/qualified-oci/receipt.json
            ${{ runner.temp }}/qualified-oci/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
